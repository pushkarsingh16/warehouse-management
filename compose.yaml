x-node: &node
  build: .
  environment: &env
    MONGODB_URI: mongodb://mongo:27017/warehouse_os?replicaSet=rs0
    KAFKA_BROKERS: kafka:9092
    APP_ORIGIN: http://localhost:5173
    ML_SERVICE_URL: http://ml:8000
    SIMULATION_ENABLED: 'true'
    SEED_PASSWORD: ${SEED_PASSWORD:-warehouse-demo-password-change-me}
  depends_on:
    mongo-init:
      condition: service_completed_successfully
    kafka:
      condition: service_healthy
  restart: on-failure
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['5173:80']
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      retries: 10
    restart: on-failure
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ping:1})']
      interval: 5s
      retries: 30
  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: [sh, -c]
    command:
      - 'mongosh --host mongo --quiet --eval "try { rs.status() } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}) }"; until mongosh --host mongo --quiet --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; do sleep 1; done'
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: root
    entrypoint: [sh, -c, 'chown -R 1000:1000 /data']
    volumes: [kafka-data:/data]
  kafka:
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: [kafka-data:/tmp/kraft-combined-logs]
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      retries: 30
  api:
    <<: *node
    environment:
      <<: *env
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
    ports: ['4000:4000']
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10
  outbox:
    <<: *node
    command: [node, apps/server/src/outbox.js]
  workers:
    <<: *node
    command: [node, apps/server/src/workers.js]
  simulator:
    <<: *node
    command: [node, apps/server/src/simulator.js]
  ml:
    build: ./apps/ml
    volumes: [model-data:/models]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 20
    restart: on-failure
  forecast-worker:
    <<: *node
    command: [node, apps/server/src/forecast-worker.js]
  model-training:
    build: ./apps/ml
    profiles: [tools]
    volumes: [model-data:/models]
    command: [python, train.py]
  ml-migrate:
    <<: *node
    restart: 'no'
    profiles: [tools]
    command: [node, apps/server/src/ml-migrate.js]
  seed:
    <<: *node
    restart: 'no'
    profiles: [tools]
    command: [node, apps/server/src/seed.js]
volumes:
  mongo-data:
  kafka-data:
  model-data:
